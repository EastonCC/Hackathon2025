version: '3.8'

services:
  backend:
    build: ./backend
    container_name: valdosta-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost
    volumes:
      - ./backend/database.sqlite:/app/database.sqlite
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: valdosta-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
